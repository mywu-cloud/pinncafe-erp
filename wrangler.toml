name = "pinncafe-erp"
compatibility_date = "2026-01-01"
pages_build_output_dir = "web"

# D1 資料庫：建立後把 database_id 換成實際值
#   npx wrangler d1 create pinncafe-erp
[[d1_databases]]
binding = "DB"
database_name = "pinncafe-erp"
database_id = "a31cae4a-e37e-4353-8baa-a19928c96adf"

# Cloudflare Access：專案有 wrangler.toml 時，Pages 以此檔為設定來源（儀表板無法另設一般變數），
# 所以寫在這裡。這兩個值是識別碼，不是密鑰。
[vars]
CF_ACCESS_TEAM_DOMAIN = "tw-mywu.cloudflareaccess.com"
CF_ACCESS_AUD = "b81b2de6599aec2ae1c73d46fdc8b7c1c148ef3874b335e6c36798bccb3fa8c3"
